name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Konfiguracja Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Konwersja HTML do projektu Android (Capacitor)
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init FotoSort com.fotosort.app --web-dir www
          npx cap add android

      - name: Naprawa konfliktu klas Kotlina
        run: |
          echo "configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }" >> android/app/build.gradle

      - name: Budowanie pliku APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Zapisz plik APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: fotosort-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
